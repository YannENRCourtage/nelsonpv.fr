<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <!-- Capture globale de l'événement beforeinstallprompt -->
  <script>
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      console.log("Événement d'installation capturé");
      window.dispatchEvent(new Event('pwa-prompt-captured'));
    });
  </script>

  <!-- Feuille Leaflet (ok même si déjà bundlée) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html,
    body,
    #root {
      height: 100%;
    }

    body {
      margin: 0;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Start of Statcounter Code -->
  <script type="text/javascript">
    var sc_project=13184566; 
    var sc_invisible=1; 
    var sc_security="3238a270"; 
  </script>
  <script type="text/javascript" src="https://www.statcounter.com/counter/counter.js" async></script>
  <noscript>
    <div class="statcounter"><a title="web stats" href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/13184566/0/3238a270/1/"
  alt="web stats"
  referrerPolicy="no-referrer-when-downgrade"></a></div>
  </noscript>
  <!-- End of Statcounter Code -->

  <!-- Enregistrement du Service Worker pour la PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('ServiceWorker enregistré avec succès.', registration.scope);
          })
          .catch((error) => {
            console.error('Erreur lors de l\'enregistrement du ServiceWorker:', error);
          });
      });
    }
  </script>
</body>
